<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 id="title">Original Text</h1>
    <button onClick="onHandleUpdateText()">Change Text</button>
  </body>
</html>

<script>
  function onHandleUpdateText() {
    document.getElementById('title').textContent = 'Updated Text';
  }
</script>
