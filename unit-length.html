<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Length</title>
    <link rel="stylesheet" href="unit-length.css" />
  </head>
  <body>
    <!-- 
    em 
    - Unit length yang diperuntukan font size
    - Ukurannya relative terhadap parent nya 
    -->

    <div id="wrapper-01">
      <div>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Enim qui et
          suscipit blanditiis eum voluptatibus. Quas quis, dolore a, quia
          tempora, placeat deleniti voluptatem explicabo rerum nobis aliquam
          eveniet earum?
        </p>
      </div>
    </div>

    <!-- 
    rem 
    - Unit length yang diperuntukan font size
    - Ukurannya relative terhadap root nya
    -->
    <div id="wrapper-02">
      <p>Hello, World!</p>
    </div>

    <!-- 
    vw (viewport width)
    - Ukurannya 1% terdapat lebar layar

    vh (viewport height)
    - Ukurannya 1% terhadap tinggi layar
    -->
    <div id="wrapper-03">Hello</div>

    <!-- 
    vmin
    Nilai 1% dari dimensi layar yang lebih kecil (di antara width atau height). 

    vmax
    Nilai 1% dari dimensi layar yang lebih besar (di antara width atau height). 
    -->
    <p id="par-01">
        Hello
    </p>
  </body>
</html>
